onboarding = false
[keys]
prefix = "ctrl+f"
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""
navigate_workspace_up = "k"
navigate_workspace_down = "j"
move_tab_next = "prefix+j"
move_tab_previous = "prefix+k"
previous_workspace = "prefix+shift+h"
last_pane = "prefix+l"                   # MRU toggle between the last two workspaces/sessions
split_horizontal = "prefix+minus"
split_vertical = "prefix+backslash"
new_tab = ["prefix+c", "prefix+shift+w"]
new_workspace = "prefix+shift+s"
close_tab = "prefix+ampersand"
workspace_picker = "prefix+w"
goto = "prefix+shift+o"
rename_tab = "prefix+comma"
rename_workspace = "prefix+$"
rename_pane = "prefix+period"
copy_mode = "prefix+y"                   # herdr's copy-mode entry key; copy-mode's own internal keys (v/space select, y/Enter copy, q/Esc cancel) aren't configurable

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "local.vim-navigator.left"
description = "Vim-aware pane left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "local.vim-navigator.down"
description = "Vim-aware pane down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "local.vim-navigator.up"
description = "Vim-aware pane up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "local.vim-navigator.right"
description = "Vim-aware pane right"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "gh dash"
height = "90%"
width = "90%"
description = "open gh-dash"

[[keys.command]]
key = "prefix+ctrl+p"
type = "plugin_action"
command = "herdr-pomodoro.menu"
description = "Pomodoro menu"

[[keys.command]]
key = "prefix+ctrl+n"
type = "plugin_action"
command = "herdr-pomodoro.next"
description = "Pomodoro skip / next segment"

[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "herdr-last.toggle-workspace"
description = "Toggle to last workspace"

[[keys.command]]
key = "prefix+shift+period"
type = "plugin_action"
command = "herdr-last.toggle-tab"
description = "Toggle to last tab"

[ui]
agent_panel_sort = "spaces"
prompt_new_workspace_name = true
tab_bar_right = [
  { type = "command", command = "/Users/kirubeltadesse/dotfiles/runcom/config/herdr/pomodoro-status.sh", interval_seconds = 1, timeout_seconds = 1 },
]

show_agent_labels_on_pane_borders = false
[theme]
name = "rose-pine"
auto_switch = false
